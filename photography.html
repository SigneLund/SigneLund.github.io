<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap"
        rel="stylesheet"
    >

    <title>Photography</title>

    <style>

        /* =========================
           Photography Gallery
           ========================= */

        .photography-container {
            width: 90%;
            max-width: 1400px;
            margin: 50px auto;
        }

        .photography-container h1 {
            margin-bottom: 30px;
        }

        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .photo-item {
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            cursor: pointer;
            background: #eee;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;

            transition:
                transform 0.3s ease,
                opacity 0.3s ease;
        }

        .photo-item:hover img {
            transform: scale(1.05);
            opacity: 0.85;
        }


        /* =========================
           Image Viewer
           ========================= */

        .image-viewer {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.85);

            display: none;

            align-items: center;
            justify-content: center;

            z-index: 9999;

            padding: 30px;

            box-sizing: border-box;
        }

        .image-viewer.active {
            display: flex;
        }

        .image-viewer img {
            max-width: 90vw;
            max-height: 90vh;

            object-fit: contain;

            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }


        /* =========================
           Close button
           ========================= */

        .close-viewer {
            position: absolute;

            top: 25px;
            right: 35px;

            font-size: 40px;

            color: white;

            cursor: pointer;

            user-select: none;

            line-height: 1;

            z-index: 10000;

            transition: opacity 0.2s ease;
        }

        .close-viewer:hover {
            opacity: 0.6;
        }


        /* =========================
           Loading text
           ========================= */

        .gallery-loading {
            text-align: center;
            font-size: 18px;
            opacity: 0.7;
        }


        /* =========================
           Mobile
           ========================= */

        @media (max-width: 600px) {

            .photography-container {
                width: 94%;
                margin-top: 30px;
            }

            .photo-gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .image-viewer {
                padding: 15px;
            }

            .image-viewer img {
                max-width: 95vw;
                max-height: 85vh;
            }

            .close-viewer {
                top: 15px;
                right: 20px;
                font-size: 35px;
            }
        }

    </style>
</head>

<body>

    <!-- =========================
         Navigation
         ========================= -->

    <nav>

        <div class="logo"></div>

        <div class="burger" id="burger">☰</div>

        <ul id="nav-links">

            <li>
                <a class="page-title" href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a class="page-title" href="interiorDesign.html">
                    Interior design
                </a>
            </li>

            <li>
                <a class="page-title" href="productTechnology.html">
                    Product technology
                </a>
            </li>

            <li>
                <a class="page-title" href="photography.html">
                    Photography
                </a>
            </li>

            <li>
                <a class="page-title" href="contact.html">
                    Contact
                </a>
            </li>

        </ul>

    </nav>


    <!-- =========================
         Photography
         ========================= -->

    <main class="photography-container">

        <h1>Photography</h1>

        <div id="photo-gallery" class="photo-gallery">

            <p class="gallery-loading">
                Loading photographs...
            </p>

        </div>

    </main>


    <!-- =========================
         Image Viewer
         ========================= -->

    <div id="image-viewer" class="image-viewer">

        <div id="close-viewer" class="close-viewer">
            &times;
        </div>

        <img id="viewer-image" src="" alt="">

    </div>


    <!-- Existing JavaScript -->
    <script src="js.js"></script>


    <!-- =========================
         Photography JavaScript
         ========================= -->

    <script>

        const gallery = document.getElementById("photo-gallery");

        const imageViewer = document.getElementById("image-viewer");

        const viewerImage = document.getElementById("viewer-image");

        const closeViewer = document.getElementById("close-viewer");


        /*
         * GitHub repository information
         */

        const githubUser = "SigneLund";

        const githubRepo = "SigneLund.github.io";

        const githubPath = "images/photography";


        /*
         * Load images from GitHub
         */

        async function loadPhotography() {

            try {

                const response = await fetch(
                    `https://api.github.com/repos/${githubUser}/${githubRepo}/contents/${githubPath}`
                );

                if (!response.ok) {

                    throw new Error(
                        "Could not load photography folder."
                    );

                }

                const files = await response.json();


                /*
                 * Only allow common image formats
                 */

                const images = files.filter(file => {

                    if (file.type !== "file") {
                        return false;
                    }

                    const name = file.name.toLowerCase();

                    return (
                        name.endsWith(".jpg") ||
                        name.endsWith(".jpeg") ||
                        name.endsWith(".png") ||
                        name.endsWith(".webp") ||
                        name.endsWith(".gif")
                    );

                });


                /*
                 * Clear loading message
                 */

                gallery.innerHTML = "";


                /*
                 * No images
                 */

                if (images.length === 0) {

                    gallery.innerHTML = `
                        <p>
                            No photographs found.
                        </p>
                    `;

                    return;
                }


                /*
                 * Create gallery items
                 */

                images.forEach(file => {

                    const imageContainer =
                        document.createElement("div");

                    imageContainer.className =
                        "photo-item";


                    const image =
                        document.createElement("img");


                    /*
                     * GitHub raw image URL
                     */

                    image.src =
                        `https://raw.githubusercontent.com/${githubUser}/${githubRepo}/main/${githubPath}/${encodeURIComponent(file.name)}`;


                    image.alt =
                        file.name;


                    image.loading =
                        "lazy";


                    /*
                     * Open image when clicked
                     */

                    imageContainer.addEventListener(
                        "click",
                        () => {

                            viewerImage.src =
                                image.src;

                            viewerImage.alt =
                                image.alt;

                            imageViewer.classList.add(
                                "active"
                            );

                            document.body.style.overflow =
                                "hidden";

                        }
                    );


                    imageContainer.appendChild(
                        image
                    );

                    gallery.appendChild(
                        imageContainer
                    );

                });

            }

            catch (error) {

                console.error(
                    "Photography gallery error:",
                    error
                );

                gallery.innerHTML = `
                    <p>
                        Could not load photographs.
                    </p>
                `;

            }

        }


        /*
         * Close image viewer
         */

        function closeImageViewer() {

            imageViewer.classList.remove(
                "active"
            );

            viewerImage.src = "";

            document.body.style.overflow =
                "";

        }


        /*
         * Close button
         */

        closeViewer.addEventListener(
            "click",
            closeImageViewer
        );


        /*
         * Clicking the dark background closes it.
         *
         * Clicking the actual image does not.
         */

        imageViewer.addEventListener(
            "click",
            (event) => {

                if (event.target === imageViewer) {

                    closeImageViewer();

                }

            }
        );


        /*
         * ESC closes the viewer
         */

        document.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key === "Escape" &&
                    imageViewer.classList.contains("active")
                ) {

                    closeImageViewer();

                }

            }
        );


        /*
         * Start gallery
         */

        loadPhotography();

    </script>

</body>
</html>
