
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Model</title>

    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        model-viewer {
            display: block;
            width: 100vw;
            height: 100vh;
            background: white;
        }

    </style>
</head>

<body>

    <model-viewer
        id="model"
        src="models/ass_2.glb"
        camera-orbit="0deg 75deg 105%"
        field-of-view="30deg">
    </model-viewer>


    <script>

        const model = document.getElementById("model");

        // Normal position
        let currentX = 0;
        let currentY = 0;

        // Target position
        let targetX = 0;
        let targetY = 0;

        // =====================================================
        // HOVER
        // =====================================================

        model.addEventListener("mouseenter", () => {

            targetX = 20;
            targetY = 30;

        });


        // =====================================================
        // UNHOVER
        // =====================================================

        model.addEventListener("mouseleave", () => {

            targetX = 0;
            targetY = 0;

        });


        // =====================================================
        // SMOOTH ANIMATION
        // =====================================================

        function animate() {

            requestAnimationFrame(animate);

            currentX += (targetX - currentX) * 0.08;
            currentY += (targetY - currentY) * 0.08;

            model.cameraOrbit =
                `${currentY}deg ${75 + currentX}deg 105%`;

        }

        animate();

    </script>

</body>

</html>
