<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Model</title>

    <!-- Model Viewer -->
    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        model-viewer {
            display: block;
            width: 100vw;
            height: 100vh;
            background: white;
        }

    </style>
</head>

<body>

    <model-viewer
        id="model"
        src="models/ass_2.glb"
        camera-orbit="0deg 75deg 105%"
        field-of-view="30deg"
        exposure="0.1">
    </model-viewer>


    <script>

        const model = document.getElementById("model");

        // Current rotation
        let rotationX = 0;
        let rotationY = 0;

        // How much the mouse affects the model
        const sensitivityX = 30;
        const sensitivityY = 20;

        // Smoothness
        let targetX = 0;
        let targetY = 0;

        // Mouse movement
        model.addEventListener("mousemove", (event) => {

            const rect = model.getBoundingClientRect();

            // Mouse position from -1 to +1
            const mouseX =
                ((event.clientX - rect.left) / rect.width) * 2 - 1;

            const mouseY =
                ((event.clientY - rect.top) / rect.height) * 2 - 1;

            // Horizontal rotation
            targetY = mouseX * sensitivityX;

            // Vertical rotation
            targetX = -mouseY * sensitivityY;

        });


        // Reset when mouse leaves
        model.addEventListener("mouseleave", () => {

            targetX = 0;
            targetY = 0;

        });


        // Smooth animation
        function animate() {

            requestAnimationFrame(animate);

            rotationX +=
                (targetX - rotationX) * 0.08;

            rotationY +=
                (targetY - rotationY) * 0.08;

            model.cameraOrbit =
                `${rotationY}deg ${75 + rotationX}deg 105%`;

        }

        animate();

    </script>

</body>

</html>
