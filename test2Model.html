<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Model</title>

    <!-- Model Viewer -->
    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
        }

        model-viewer {
            display: block;
            width: 100vw;
            height: 100vh;
            background: white;
        }
    </style>
</head>

<body>

    <model-viewer
        id="model"
        src="models/ASS-CASE1.glb"
        camera-orbit="0deg 75deg 105%"
        field-of-view="30deg">
    </model-viewer>

    <script>

        const model = document.getElementById("model");

        let rotation = 0;

        window.addEventListener("wheel", (event) => {

            if (event.deltaY > 0) {
                rotation += 10;
            } else {
                rotation -= 10;
            }

            model.cameraOrbit =
                `${rotation}deg 75deg 105%`;

        });

    </script>

</body>

</html>
